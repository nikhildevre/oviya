name: Bug Report
description: File a bug report to help us improve Oviya
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      description: Please check the boxes to confirm you have taken the necessary steps.
      options:
        - label: I have searched the existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest version of the Oviya theme.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we replicate this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Please provide your system configuration details.
      placeholder: |
        - WordPress Version: [e.g. 6.7]
        - PHP Version: [e.g. 8.1]
        - Browser: [e.g. Chrome, Safari]
        - Active Plugins (if relevant): [...]
    validations:
      required: true